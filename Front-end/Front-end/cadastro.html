<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Aprov+ </title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <main class="pagina-cadastro">
        <section class="card-cadastro">
           <div class="perfil">

                <img src="images/fotoperfil.jpg" alt="Foto de perfil" id="fotoPerfil">

            </div>

            <div class="cabecalho">
            <h1>  Crie sua conta</h1>
            <p>Comece sua preparação para o ENEM e vestibulares.</p>
            </div>


            <form id="formCadastro">

                <button type="button" class="botao-google"id="botaoGoogle">
                <span class="icone-google"> G </span>
                <span> Entrar com Google </span>
                </button>


                <div class="divisor">
                <span>  ou  </span>
                 </div>


                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                </div>


                <div class="campo">
                    <label for="senha"> Senha </label>

                    <div class="campo-senha">
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="new-password" required>
                        <button type="button" class="mostrar-senha" id="mostrarSenha" > Mostrar</button>

                    </div>
                </div>


                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>

                    <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Confirme sua senha" autocomplete="new-password" required>
                </div>


                <div id="mensagem" class="mensagem"></div>


                <button type="submit" class="botao-cadastro"> Criar conta </button>
            </form>


            <div class="login">
            <span>Já possui uma conta?</span>

            <a href="login.html">Entrar </a>
</div>

        </section>
    </main>

    
    <script src="cadastro.js"></script>

</body>

</html>
